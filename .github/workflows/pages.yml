name: Actualizar landing y desplegar a GitHub Pages

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Descargar actualización de sorteos (CSV)
        run: npm run fetch

      - name: Regenerar landing (web/data.js)
        run: npm run build:web

      - name: Commit de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ web/
          git diff --cached --quiet || git commit -m "chore: actualizar sorteos y landing [skip ci]"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio (./web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4